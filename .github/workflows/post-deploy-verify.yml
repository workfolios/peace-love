name: Post-Deployment Verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: read

jobs:
  verify-live-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_URL: https://workfolios.github.io/peace-love/
      FORMSPREE_ENDPOINT: https://formspree.io/f/mqervbwa
    steps:
      - name: Verify public HTTP endpoints and deployed content
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            local url="$1"
            local output="$2"
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              --connect-timeout 15 --max-time 60 \
              "$url" --output "$output"
          }

          fetch "$SITE_URL" /tmp/index.html
          fetch "${SITE_URL}robots.txt" /tmp/robots.txt
          fetch "${SITE_URL}sitemap.xml" /tmp/sitemap.xml
          fetch "${SITE_URL}assets/images/favicon.svg" /tmp/favicon.svg
          fetch "${SITE_URL}assets/images/og-preview-hero-v6.png" /tmp/og-preview-hero-v6.png

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          html = Path('/tmp/index.html').read_text()

          required = {
              '<title>Peace Love Home + Pet Watch</title>': 'page title',
              '<link rel="canonical" href="https://workfolios.github.io/peace-love/" />': 'canonical URL',
              '<meta name="robots" content="index,follow,max-image-preview:large" />': 'robots metadata',
              'https://workfolios.github.io/peace-love/sitemap.xml': 'sitemap link',
              'https://workfolios.github.io/peace-love/assets/images/og-preview-hero-v6.png': 'social preview URL',
          }
          for marker, label in required.items():
              if marker not in html:
                  raise SystemExit(f'Missing deployed {label}')

          script_match = re.search(r'<script type="module" crossorigin src="([^"]+)"', html)
          if not script_match:
              raise SystemExit('Compiled JavaScript entry was not found')
          Path('/tmp/js-path.txt').write_text(script_match.group(1))

          json_ld = re.findall(r'<script type="application/ld\+json">\s*(.*?)\s*</script>', html, re.S)
          if len(json_ld) != 1:
              raise SystemExit(f'Expected one JSON-LD block, found {len(json_ld)}')
          payload = json.loads(json_ld[0])
          graph = payload.get('@graph', [])
          types = {item.get('@type') for item in graph}
          if not {'WebSite', 'Organization'}.issubset(types):
              raise SystemExit(f'Unexpected structured-data types: {types}')

          robots = Path('/tmp/robots.txt').read_text()
          if 'Allow: /peace-love/' not in robots or 'Sitemap: https://workfolios.github.io/peace-love/sitemap.xml' not in robots:
              raise SystemExit('Deployed robots.txt is incomplete')

          sitemap = Path('/tmp/sitemap.xml').read_text()
          if '<loc>https://workfolios.github.io/peace-love/</loc>' not in sitemap:
              raise SystemExit('Deployed sitemap canonical URL is missing')
          PY

          JS_PATH="$(cat /tmp/js-path.txt)"
          fetch "https://workfolios.github.io${JS_PATH}" /tmp/application.js

          grep -Fq "$FORMSPREE_ENDPOINT" /tmp/application.js
          grep -Fq 'Sending Your Request...' /tmp/application.js
          grep -Fq 'Your request could not be delivered' /tmp/application.js
          grep -Fq 'Your testimonial has been saved in this browser as a website demonstration' /tmp/application.js
          grep -Fq 'not transmitted to Jamie Giedd' /tmp/application.js
          grep -Fq 'reservation-availability-dropdown' /tmp/application.js

      - name: Render desktop and mobile browser smoke tests
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"

          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=8000 \
            --screenshot=/tmp/desktop.png "$SITE_URL"

          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --hide-scrollbars --window-size=390,844 --force-device-scale-factor=1 \
            --virtual-time-budget=8000 --screenshot=/tmp/mobile.png "$SITE_URL"

          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --virtual-time-budget=8000 --dump-dom "$SITE_URL" > /tmp/rendered-dom.html

          grep -Fq 'Peace Love Home + Pet Watch' /tmp/rendered-dom.html
          grep -Fq 'Say Hello' /tmp/rendered-dom.html
          grep -Fq 'House Watch' /tmp/rendered-dom.html
          grep -Fq 'Drop-In Pet Care' /tmp/rendered-dom.html

      - name: Run Lighthouse diagnostics
        shell: bash
        run: |
          set -euo pipefail
          LIGHTHOUSE_VERSION="$(npm view lighthouse version)"
          echo "Using Lighthouse ${LIGHTHOUSE_VERSION}"
          npx --yes "lighthouse@${LIGHTHOUSE_VERSION}" "$SITE_URL" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=/tmp/lighthouse.json --quiet

          python - <<'PY'
          from pathlib import Path
          import json

          report = json.loads(Path('/tmp/lighthouse.json').read_text())
          scores = {
              name: round(category['score'] * 100)
              for name, category in report['categories'].items()
          }
          print('Lighthouse scores:', json.dumps(scores, sort_keys=True))
          Path('/tmp/lighthouse-scores.json').write_text(json.dumps(scores, indent=2, sort_keys=True) + '\n')
          PY

      - name: Send one controlled Formspree delivery test
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/formspree-test.json <<'JSON'
          {
            "_subject": "Peace Love Home + Pet Watch deployment verification test",
            "name": "DevOps Verification Test",
            "phone": "555-0100",
            "email": "qa-verification@example.com",
            "serviceNeeded": "QA verification only — no service request",
            "travelDates": "Not applicable",
            "frequencyNeeded": "One controlled deployment test",
            "neighborhood": "Automated GitHub Pages verification",
            "clientType": "Test submission",
            "petsInvolved": "No",
            "petsDescription": "",
            "specialHomeInstructions": "",
            "specialPetInstructions": "",
            "emergencyContact": "Not applicable",
            "preferredUpdateMethod": "No follow-up required",
            "additionalNotes": "This is the single controlled post-deployment Formspree verification authorized for the Peace Love Home + Pet Watch QA remediation. Please disregard as a customer inquiry."
          }
          JSON

          STATUS="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --request POST "$FORMSPREE_ENDPOINT" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://workfolios.github.io' \
            --data-binary @/tmp/formspree-test.json \
            --output /tmp/formspree-response.json \
            --write-out '%{http_code}')"

          cat /tmp/formspree-response.json
          case "$STATUS" in
            200|201|202) ;;
            *) echo "Unexpected Formspree HTTP status: $STATUS" >&2; exit 1 ;;
          esac

          python - <<'PY'
          from pathlib import Path
          import json

          response = json.loads(Path('/tmp/formspree-response.json').read_text())
          if response.get('ok') is not True:
              raise SystemExit(f'Formspree did not confirm success: {response}')
          print('Formspree confirmed the controlled test submission.')
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v4
        with:
          name: post-deploy-verification
          path: |
            /tmp/index.html
            /tmp/robots.txt
            /tmp/sitemap.xml
            /tmp/favicon.svg
            /tmp/og-preview-hero-v6.png
            /tmp/application.js
            /tmp/rendered-dom.html
            /tmp/desktop.png
            /tmp/mobile.png
            /tmp/lighthouse.json
            /tmp/lighthouse-scores.json
            /tmp/formspree-test.json
            /tmp/formspree-response.json
          if-no-files-found: warn
          retention-days: 1
