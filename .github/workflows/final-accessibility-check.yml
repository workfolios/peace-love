name: Align Brand Text Accessibility

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup approved Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Add semantic spaces to the visual wordmark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.source/peace-love-app-source/src/components/Header.tsx')
          text = path.read_text()

          label = '            aria-label="Peace Love Home + Pet Watch"\n'
          if text.count(label) != 1:
              raise RuntimeError('Expected the current exact brand aria-label once.')
          text = text.replace(label, '', 1)

          replacements = [
              (
                  '<span className="text-[#100720]">Peace</span>\n                <span className="text-[#9C5B7F]">Love</span>',
                  '<span className="text-[#100720]">Peace</span>{\' \'}\n                <span className="text-[#9C5B7F]">Love</span>',
              ),
              (
                  '<span className="text-[#9C5B7F]">Love</span>\n                <span className="text-[#100720]">Home</span>',
                  '<span className="text-[#9C5B7F]">Love</span>{\' \'}\n                <span className="text-[#100720]">Home</span>',
              ),
              (
                  '<span className="text-[#100720]">Home</span>\n                <span className="text-[#9C5B7F] select-none inline-flex items-center justify-center font-extrabold">+</span>',
                  '<span className="text-[#100720]">Home</span>{\' \'}\n                <span className="text-[#9C5B7F] select-none inline-flex items-center justify-center font-extrabold">+</span>',
              ),
              (
                  '<span className="text-[#9C5B7F] select-none inline-flex items-center justify-center font-extrabold">+</span>\n                <span className="text-[#100720]">Pet</span>',
                  '<span className="text-[#9C5B7F] select-none inline-flex items-center justify-center font-extrabold">+</span>{\' \'}\n                <span className="text-[#100720]">Pet</span>',
              ),
              (
                  '<span className="text-[#100720]">Pet</span>\n                <span className="text-[#100720]">Watch</span>',
                  '<span className="text-[#100720]">Pet</span>{\' \'}\n                <span className="text-[#100720]">Watch</span>',
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected one wordmark boundary: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate deterministic build
        working-directory: .source/peace-love-app-source
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run lint
          npm run build

      - name: Commit bounded F-06 correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .source/peace-love-app-source/src/components/Header.tsx
          git commit -m "Align brand text and accessible name"
          git push origin HEAD:${{ github.head_ref }}
