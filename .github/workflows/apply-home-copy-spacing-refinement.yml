name: Apply Home Copy and Spacing Refinement

on:
  push:
    branches:
      - agent/home-copy-spacing-refinement

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Apply approved Home and footer refinements
        run: |
          python <<'PY'
          from pathlib import Path

          home_path = Path('.source/peace-love-app-source/src/components/HomeView.tsx')
          footer_path = Path('.source/peace-love-app-source/src/components/Footer.tsx')
          home = home_path.read_text()
          footer = footer_path.read_text()

          replacements = [
              (
                  '<p className={`${sectionSubtitleClass} max-w-xl`}>\n                Real care, documented feedback, and neighborly peace of mind across the Black Hills.\n              </p>',
                  '<p className={`${sectionSubtitleClass} max-w-xl md:max-w-2xl`}>\n                Real care, documented feedback, and neighborly peace of mind across the Black Hills.\n              </p>'
              ),
              (
                  '''            <h2 className={sectionTitleClass}>Join the Prairie Land Reserve Network</h2>\n            <p className="text-base text-brand-plum/80 max-w-2xl mx-auto font-medium leading-relaxed">\n              Are you reliable, experienced with pets, and interested in occasional, flexible shift coverage? \n              Apply to join our tested standby list. Set your own availability calendar, pass a background check, \n              and earn extra income when we need emergency or overflow coverage.\n            </p>''',
                  '''            <h2 className={sectionTitleClass}>Join the Home + Pet Watch Standby Network</h2>\n            <div className="max-w-2xl mx-auto space-y-4 text-base text-brand-plum/80 font-medium leading-relaxed">\n              <p>Are you reliable, experienced with pets, and interested in occasional, flexible coverage?</p>\n              <p>Apply to join our standby network. Set your own availability, complete a background check, and earn extra income when short-notice or overflow coverage is needed.</p>\n            </div>'''
              ),
          ]

          for old, new in replacements:
              count = home.count(old)
              if count != 1:
                  raise SystemExit(f'HomeView replacement expected once, found {count}: {old[:80]!r}')
              home = home.replace(old, new, 1)

          old_footer = '''              <p className="text-sm leading-relaxed max-w-sm font-medium text-[#D6C9DF]">\n                Locally owned, bonded, and trusted. Helping homeowners travel with a little more peace of mind by providing reliable property check-ins and premium companion animal sitting in Rapid City and the Black Hills.\n              </p>'''
          new_footer = '''              <div className="max-w-sm space-y-4 text-sm leading-relaxed font-medium text-[#D6C9DF]">\n                <p>Locally owned, bonded, and trusted.</p>\n                <p>Helping homeowners travel with a little more peace of mind by providing reliable property check-ins and premium companion animal sitting.</p>\n              </div>'''
          count = footer.count(old_footer)
          if count != 1:
              raise SystemExit(f'Footer replacement expected once, found {count}')
          footer = footer.replace(old_footer, new_footer, 1)

          home_path.write_text(home)
          footer_path.write_text(footer)
          PY

      - name: Verify bounded diff
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.source/peace-love-app-source/src/components/Footer.tsx' '.source/peace-love-app-source/src/components/HomeView.tsx')"
          test "$changed" = "$expected"
          grep -Fq 'max-w-xl md:max-w-2xl' .source/peace-love-app-source/src/components/HomeView.tsx
          grep -Fq 'Join the Home + Pet Watch Standby Network' .source/peace-love-app-source/src/components/HomeView.tsx
          grep -Fq 'short-notice or overflow coverage is needed.' .source/peace-love-app-source/src/components/HomeView.tsx
          grep -Fq 'Locally owned, bonded, and trusted.</p>' .source/peace-love-app-source/src/components/Footer.tsx
          ! grep -Fq 'Prairie Land Reserve Network' .source/peace-love-app-source/src/components/HomeView.tsx
          ! grep -Fq 'in Rapid City and the Black Hills.' .source/peace-love-app-source/src/components/Footer.tsx

      - name: Install, audit, type-check, and build
        working-directory: .source/peace-love-app-source
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run lint
          npm run build

      - name: Commit approved refinements
        run: |
          set -euo pipefail
          git config user.name 'Workfolio Studio'
          git config user.email 'brian.j.curr@gmail.com'
          git add .source/peace-love-app-source/src/components/HomeView.tsx .source/peace-love-app-source/src/components/Footer.tsx
          git commit -m 'Refine Home copy spacing and standby messaging'
          git push origin HEAD:${GITHUB_REF_NAME}
