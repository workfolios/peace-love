name: Apply Exact Brand Accessible Name

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup approved Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Set exact visible brand accessible name
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.source/peace-love-app-source/src/components/Header.tsx')
          text = path.read_text()
          marker = '            className="flex flex-col cursor-pointer group select-none pr-4 p-0 bg-transparent border-0 text-left"\n'
          replacement = marker + '            aria-label="Peace Love Home + Pet Watch"\n'
          if 'aria-label="Peace Love Home + Pet Watch"' in text:
              raise RuntimeError('The exact brand accessible name is already present.')
          count = text.count(marker)
          if count != 1:
              raise RuntimeError(f'Expected one semantic brand button class marker, found {count}')
          path.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Validate deterministic build
        working-directory: .source/peace-love-app-source
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run lint
          npm run build

      - name: Commit bounded F-06 correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .source/peace-love-app-source/src/components/Header.tsx
          git commit -m "Set exact brand accessible name"
          git push origin HEAD:${{ github.head_ref }}
