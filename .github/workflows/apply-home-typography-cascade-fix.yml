name: Apply Home Typography Cascade Fix

on:
  push:
    branches:
      - agent/home-typography-cascade-fix

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/home-typography-cascade-fix

      - name: Setup approved Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Apply Home-only cascade correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.source/peace-love-app-source/src/components/HomeView.tsx')
          text = path.read_text()
          old_subtitle = "const sectionSubtitleClass = 'text-sm sm:text-base font-semibold text-brand-text/85 leading-relaxed';"
          new_subtitle = "const sectionSubtitleClass = 'text-sm! sm:text-base! font-semibold text-brand-text/85 leading-relaxed!';"
          old_eyebrow = "const moduleEyebrowClass = 'text-xs text-[#9C5B7F] font-bold uppercase tracking-wider';"
          new_eyebrow = "const moduleEyebrowClass = 'text-xs! text-[#9C5B7F] font-bold uppercase tracking-wider';"
          if text.count(old_subtitle) != 1 or text.count(old_eyebrow) != 1:
              raise RuntimeError('Expected Home typography constants were not found exactly once.')
          text = text.replace(old_subtitle, new_subtitle).replace(old_eyebrow, new_eyebrow)
          path.write_text(text)
          PY

      - name: Validate deterministic release gate
        working-directory: .source/peace-love-app-source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run lint
          npm run build

      - name: Verify bounded diff
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --short --untracked-files=no | awk '{print $2}')"
          test "$changed" = ".source/peace-love-app-source/src/components/HomeView.tsx"

      - name: Commit Home-only cascade correction
        run: |
          set -euo pipefail
          git config user.name "Workfolio Studio"
          git config user.email "brian.j.curr@gmail.com"
          git add .source/peace-love-app-source/src/components/HomeView.tsx
          git commit -m "Ensure Home typography overrides paragraph defaults"
          git push origin HEAD:agent/home-typography-cascade-fix
