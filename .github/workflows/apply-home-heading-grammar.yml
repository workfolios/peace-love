name: Diagnose Nanoid Advisory

on:
  push:
    branches:
      - agent/home-heading-grammar

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/home-heading-grammar

      - name: Setup approved Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Diagnose transitive advisory without committing changes
        working-directory: .source/peace-love-app-source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          echo "--- Installed nanoid dependency path ---"
          npm ls nanoid || true
          echo "--- Fixed nanoid release check ---"
          npm view nanoid@3.3.17 version
          echo "--- Lockfile-only audit fix dry run ---"
          npm audit fix --package-lock-only --dry-run || true
          echo "--- Dry-run repository diff ---"
          git diff -- package-lock.json || true
