name: Apply and Validate Approved QA Remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup approved Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Apply approved bounded remediation
        run: |
          python .github/scripts/apply-approved-remediation.py
          python .github/scripts/fix-request-submit-markup.py

      - name: Generate deterministic npm lockfile
        working-directory: .source/peace-love-app-source
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate clean install, dependency audit, types, and production build
        working-directory: .source/peace-love-app-source
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run lint
          npm run build

      - name: Commit validated application remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/deploy.yml .github/workflows/validate.yml
          git add .gitignore .source/peace-love-app-source
          git commit -m "Remediate approved application findings F-01 and F-04 through F-08"
          git push origin HEAD:${{ github.head_ref }}
