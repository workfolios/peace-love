name: Set Exact Brand Accessible Name

on:
  push:
    branches:
      - agent/final-live-verification
    paths:
      - .github/workflows/set-brand-accessible-name.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/final-live-verification

      - name: Add exact visible accessible name
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.source/peace-love-app-source/src/components/Header.tsx')
          text = path.read_text()
          old = '''            className="flex flex-col cursor-pointer group select-none pr-4 p-0 bg-transparent border-0 text-left"
          >'''
          new = '''            className="flex flex-col cursor-pointer group select-none pr-4 p-0 bg-transparent border-0 text-left"
            aria-label="Peace Love Home + Pet Watch"
          >'''
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'Expected one semantic brand button marker, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit bounded F-06 correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .source/peace-love-app-source/src/components/Header.tsx
          git commit -m "Set exact brand accessible name"
          git push origin HEAD:agent/final-live-verification
